<div class="relative bg-gradient-to-r from-emerald-800 via-emerald-900/80 to-slate-950 rounded-[2rem] p-6 md:p-8 border border-white/5 shadow-2xl group overflow-hidden">
  <div class="flex flex-col lg:flex-row lg:items-center gap-5 md:gap-6">

    <div class="flex flex-col flex-shrink-0 lg:w-1/5">
      <span class="text-[9px] text-zinc-400 tracking-[0.4em] uppercase mb-1">Salida</span>
      <h2 class="text-3xl md:text-5xl font-extralight text-white tracking-tighter">{{ flight().origin }}</h2>
      <p class="text-[10px] text-[#00875A] font-bold tracking-widest mt-2 uppercase">{{ getCityName(flight().origin) }}</p>
      <span class="text-[9px] text-zinc-600 tracking-widest mt-1">Flight {{ flight().id }}</span>
    </div>

    <div class="flex-grow flex flex-col items-center justify-center relative">
      <div class="relative z-10 bg-transparent transition-transform duration-1000 ease-in-out group-hover:translate-x-8 text-zinc-500 group-hover:text-[#00875A]">
        <svg class="w-5 h-5 md:w-6 md:h-6 rotate-90" fill="currentColor" viewBox="0 0 24 24">
          <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </div>
      <div class="mt-2 text-center">
        <span class="text-[9px] text-zinc-400 tracking-[0.3em] uppercase block">Vuelo Directo</span>
        <span class="text-xs text-zinc-100 tracking-widest">08:45 — 10:00</span>
      </div>
    </div>

    <div class="flex flex-col lg:items-end flex-shrink-0 lg:w-1/5">
      <span class="text-[9px] text-zinc-400 tracking-[0.4em] uppercase mb-1">Llegada</span>
      <h2 class="text-3xl md:text-5xl font-extralight text-white tracking-tighter">{{ flight().destination }}</h2>
      <p class="text-[10px] text-[#00875A] font-bold tracking-widest mt-2 uppercase">{{ getCityName(flight().destination) }}</p>
    </div>

    <div class="flex flex-col items-center lg:items-end justify-center lg:border-l lg:border-zinc-800 lg:pl-6 lg:ml-2 min-w-[140px] md:min-w-[180px] flex-shrink-0">
      <span class="text-[9px] text-zinc-400 tracking-[0.2em] uppercase mb-1">Precio Final</span>
      <div class="text-2xl md:text-3xl font-extralight text-white tracking-tighter">
        {{ flight().price | currency:'EUR':'symbol':'1.0-0' }}
      </div>
      <button (click)="booking()" class="mt-3 w-full lg:w-auto bg-transparent border border-[#00875A] hover:bg-[#00875A] text-white py-2.5 md:py-3.5 px-5 md:px-6 text-[9px] md:text-[10px] tracking-[0.3em] uppercase transition-all duration-500 active:scale-95">
        RESERVAR
      </button>
    </div>

  </div>
</div>
